# Accept the EULA (required, or Helm refuses to install).
eula:
  accept: true
  company: "Personal Lab"       # ← required field
  email: "lab@example.com"      # ← required field

# Token-based auth for the Kasten dashboard.
auth:
  tokenAuth:
    enabled: true

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

kanister:
  enabled: true

# Uncomment for air-gapped installs
# global:
#   airgapped:
#     repository: localhost:5001/kasten
# metering:
#   mode: airgap